[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aivis"
version = "0.1.0"
description = "AEO/GEO AI 검색 노출 진단 서비스"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "extruct>=0.17.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "w3lib>=2.1.2",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]
