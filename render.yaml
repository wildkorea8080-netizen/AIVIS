# Render Blueprint — 백엔드(FastAPI) 배포 설정
#
# 시크릿은 이 파일에 적지 않는다. sync: false 로 선언된 값은 저장소에 저장되지 않고
# Render 대시보드(Environment 탭)에서만 주입된다.

services:
  - type: web
    name: aivis-api
    runtime: python
    plan: free
    region: singapore          # 한국에서 가장 가까운 무료 리전
    branch: master

    buildCommand: pip install -e . && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # 필수 — Neon 연결 문자열
      - key: DATABASE_URL
        sync: false

      # 관리자 엔드포인트(/monitor/schedule/run-now) 보호.
      # 미설정이면 해당 엔드포인트는 403으로 닫힌다.
      - key: ADMIN_TOKEN
        sync: false

      # 모니터링 대상 AI 엔진 — 키를 넣은 엔진만 추적된다
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false

      # 진단 collector용 (없으면 해당 항목은 unknown 처리)
      - key: KAKAO_REST_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
